{% extends "base.html" %}

{% block content %}
<div class="auth-card">
    <h1>Create account</h1>
    <p>Start saving your conversations.</p>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post" action="/register">
        <label>Username</label>
        <input type="text" name="username" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <label>WhatsApp phone number</label>
        <input type="text" name="phone_number" placeholder="+216xxxxxxxx" required>

        <label style="display:flex; gap:8px; align-items:flex-start; margin-top:12px;">
            <input type="checkbox" name="whatsapp_opt_in" value="yes" required>
            <span>I agree to receive optional WhatsApp check-ins if repeated crisis language is detected.</span>
        </label>

        <button type="submit">Create account</button>
    </form>

    <p class="muted">
        Already have an account?
        <a href="/login">Login</a>
    </p>
</div>
{% endblock %}
